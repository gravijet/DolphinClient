# =============================================================================
#  Admin-Portal — Cloudflare Zero Trust
# =============================================================================
#  /admin und /admin-data sind NUR mit einem gültigen Cloudflare-Access-Token
#  erreichbar. Drei Schlösser, unabhängig voneinander:
#
#    1. Cloudflare Access (am Rand): fragt die Identität ab, bevor die Anfrage
#       den Server erreicht, und hängt ein signiertes JWT an.
#    2. Dieses Gate (am Ursprung): prüft das JWT selbst — Signatur, Aussteller,
#       AUD, Laufzeit, E-Mail. Wer die Cloudflare-Adresse umgeht und direkt den
#       Server anspricht, hat kein Token und kommt nicht rein. Läuft der
#       Prüfdienst nicht oder fehlt die Konfiguration: 503, nie offen.
#    3. Herkunft: Anfragen an /admin müssen aus dem Cloudflare-Netz kommen
#       ($dolphin_from_cf, gesetzt in conf.d/dolphinclient-cf-geo.conf).
#
#  Einrichten: deploy/setup-zero-trust.sh, Anleitung in deploy/ZERO-TRUST.md.
# =============================================================================

# Prüf-Endpunkt für auth_request. Nur intern erreichbar.
location = /__access {
    internal;
    proxy_pass http://127.0.0.1:8787/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Wer bin ich? Die einzige Stelle, die die geprüfte Identität zurückgibt — so
# zeigt das Portal an, als wer man angemeldet ist.
#
# ACHTUNG (teuer gelernt): hier darf KEIN `return 200 …` stehen. `return` läuft
# in der rewrite-Phase — also VOR der access-Phase — und würde auth_request
# komplett überspringen: die Antwort käme ohne jede Prüfung. Stattdessen
# beantwortet der Prüfdienst selbst (content-Phase, nach auth_request), und er
# prüft das Token dabei ein zweites Mal.
location = /admin-data/whoami.json {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    add_header Cache-Control "no-store";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    proxy_pass http://127.0.0.1:8787/whoami;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Die gemessenen Zahlen (deploy/admin-stats.mjs erzeugt sie per Timer).
location ^~ /admin-data/ {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    default_type application/json;
    add_header Cache-Control "no-store";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    try_files $uri =404;
}

# Die Portalseite selbst (statischer Next.js-Export).
location ^~ /admin {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    auth_request_set $access_email $upstream_http_x_access_email;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    try_files $uri $uri/ /admin/index.html;
}

# Der Prüfdienst konnte nicht entscheiden (nicht konfiguriert, nicht gestartet,
# Cloudflare nicht erreichbar). Dann bleibt die Tür zu — mit einer Erklärung.
location @access_unavailable {
    default_type text/html;
    add_header Cache-Control "no-store";
    return 503 '<!doctype html><meta charset="utf-8"><title>Admin portal sealed</title><style>body{background:#08090c;color:#e9eef6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}p{color:#98a2b1;max-width:38rem;padding:0 1.5rem}code{font-family:ui-monospace,monospace;color:#35e0c8}a{color:#35e0c8}</style><div><h1>Sealed</h1><p>The admin portal is installed but its Cloudflare Access gate is not answering, so nothing is served. On the server: <code>systemctl status dolphinclient-access</code> — and if it says the team is not configured, run <code>sudo deploy/setup-zero-trust.sh --team &lt;team&gt;.cloudflareaccess.com --aud &lt;tag&gt;</code>.</p><p><a href="/">Back to dolphinclient.de</a></p></div>';
}

# Abgewiesen: eine kurze, ehrliche Seite statt der nackten nginx-Fehlermeldung.
location @access_denied {
    default_type text/html;
    add_header Cache-Control "no-store";
    return 403 '<!doctype html><meta charset="utf-8"><title>Not authorised</title><style>body{background:#08090c;color:#e9eef6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}p{color:#98a2b1;max-width:34rem;padding:0 1.5rem}a{color:#35e0c8}</style><div><h1>Not authorised</h1><p>This area is protected by Cloudflare Access. Sign in with an approved account — if you were signed in, your session has expired; reload the page to sign in again.</p><p><a href="/">Back to dolphinclient.de</a></p></div>';
}
