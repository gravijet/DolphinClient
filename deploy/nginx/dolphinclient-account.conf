# =============================================================================
#  Account API — public, no Cloudflare Access
# =============================================================================
#  Unlike /admin, anyone may register and sign in here, so there is no
#  auth_request gate on this location — account-api.mjs (deploy/account-api.mjs)
#  does its own password hashing, session cookies and per-IP rate limiting.
#  It binds 127.0.0.1 only, same as admin-api.
#
#  Setup: deploy/setup-account-api.sh. The static pages that call this
#  (/login, /register, /dashboard, ...) need no location of their own — they
#  are ordinary files in the Next.js static export, served by the catch-all
#  `location /` in dolphinclient-locations.conf.
# =============================================================================
location ^~ /account-api/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store";
}
