name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  js:
    name: JS (backend/launcher typecheck, website build)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit -p tsconfig.json
      - name: Typecheck launcher
        run: cd launcher && npx tsc --noEmit -p tsconfig.json
      - name: Build website
        run: cd website && npx next build

  client:
    name: Client (Fabric mod, Minecraft 26.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build client
        run: |
          cd client
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain
