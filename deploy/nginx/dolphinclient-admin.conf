# =============================================================================
#  Admin-Portal — Cloudflare Zero Trust
# =============================================================================
#  /admin and /admin-data are reachable ONLY with a valid Cloudflare Access
#  token. Three locks, independent of one another:
#
#    1. Cloudflare Access (at the edge): asks for identity before the request
#       reaches the server, and attaches a signed JWT.
#    2. This gate (at the origin): verifies that JWT itself — signature,
#       issuer, AUD, lifetime, e-mail. Bypassing the Cloudflare address and
#       talking to the server directly means no token and no entry. If the
#       gate is down or unconfigured: 503, never open.
#    3. Origin: requests to /admin must come from Cloudflare's network
#       ($dolphin_from_cf, set in conf.d/dolphinclient-cf-geo.conf).
#
#  Setup: deploy/setup-zero-trust.sh, walkthrough in deploy/ZERO-TRUST.md.
# =============================================================================

# The auth_request check endpoint. Reachable internally only.
location = /__access {
    internal;
    proxy_pass http://127.0.0.1:8787/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Who am I? The only place that returns the verified identity — that is how
# the portal shows who you are signed in as.
#
# CAREFUL (learned the hard way): there must be NO `return 200 …` here.
# `return` runs in the rewrite phase — i.e. BEFORE the access phase — and would
# skip auth_request entirely: the answer would go out with no check at all.
# Instead the gate answers for itself (content phase, after auth_request), and
# it verifies the token a second time while doing so.
location = /admin-data/whoami.json {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    add_header Cache-Control "no-store";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    proxy_pass http://127.0.0.1:8787/whoami;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# The changelog write API (deploy/admin-api.mjs): publish, edit, reorder and
# delete entries, upload and remove screenshots.
#
# It deliberately lives UNDER /admin-data/ rather than at /admin-api/, because
# the Cloudflare Access application is configured for the paths `admin` and
# `admin-data` — anything under those is covered at the edge automatically,
# with no second application to remember. nginx picks the LONGEST matching ^~
# prefix, so this wins over the static /admin-data/ location below.
location ^~ /admin-data/api/ {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    client_max_body_size 9m;   # screenshots; the API itself caps at 8 MB
    proxy_pass http://127.0.0.1:8788/;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store";
}

# The measured numbers (deploy/admin-stats.mjs writes them on a timer).
location ^~ /admin-data/ {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    default_type application/json;
    add_header Cache-Control "no-store";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    try_files $uri =404;
}

# The portal page itself (static Next.js export).
location ^~ /admin {
    if ($dolphin_from_cf = 0) { return 403; }
    auth_request /__access;
    auth_request_set $access_email $upstream_http_x_access_email;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    error_page 401 403 =403 @access_denied;
    error_page 500 502 503 504 =503 @access_unavailable;
    try_files $uri $uri/ /admin/index.html;
}

# The gate could not decide (unconfigured, not running, Cloudflare
# unreachable). Then the door stays shut — with an explanation.
location @access_unavailable {
    default_type text/html;
    add_header Cache-Control "no-store";
    return 503 '<!doctype html><meta charset="utf-8"><title>Admin portal sealed</title><style>body{background:#08090c;color:#e9eef6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}p{color:#98a2b1;max-width:38rem;padding:0 1.5rem}code{font-family:ui-monospace,monospace;color:#35e0c8}a{color:#35e0c8}</style><div><h1>Sealed</h1><p>The admin portal is installed but its Cloudflare Access gate is not answering, so nothing is served. On the server: <code>systemctl status dolphinclient-access</code> — and if it says the team is not configured, run <code>sudo deploy/setup-zero-trust.sh --team &lt;team&gt;.cloudflareaccess.com --aud &lt;tag&gt;</code>.</p><p><a href="/">Back to dolphinclient.de</a></p></div>';
}

# Rejected: a short, honest page instead of nginx's bare error.
location @access_denied {
    default_type text/html;
    add_header Cache-Control "no-store";
    return 403 '<!doctype html><meta charset="utf-8"><title>Not authorised</title><style>body{background:#08090c;color:#e9eef6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}p{color:#98a2b1;max-width:34rem;padding:0 1.5rem}a{color:#35e0c8}</style><div><h1>Not authorised</h1><p>This area is protected by Cloudflare Access. Sign in with an approved account — if you were signed in, your session has expired; reload the page to sign in again.</p><p><a href="/">Back to dolphinclient.de</a></p></div>';
}
