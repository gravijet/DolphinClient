name: Release launcher

# Baut das native (Rust) DolphinClient-Launcher-Binary auf jedem OS und hängt es
# an ein GitHub-Release. Der Server zieht die Artefakte anschließend per
# `gh release download` in den Download-Ordner der Website.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bin: dolphinclient-launcher.exe
            asset: DolphinClient-windows-x64.exe
          - os: macos-latest
            platform: macos
            bin: dolphinclient-launcher
            asset: DolphinClient-macos-arm64
          - os: ubuntu-latest
            platform: linux
            bin: dolphinclient-launcher
            asset: DolphinClient-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher-native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DolphinClient ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            launcher-native/dist/${{ matrix.asset }}
