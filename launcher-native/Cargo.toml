[package]
name = "dolphinclient-launcher"
version = "0.28.0"
edition = "2021"
description = "Native DolphinClient launcher for Minecraft 26.1 (Rust + egui)."
authors = ["DolphinClient <user@example.invalid>"]
license = "UNLICENSED"
repository = "https://github.com/gravijet/DolphinClient"
default-run = "dolphinclient-launcher"

[[bin]]
name = "dolphinclient-launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
# PNG decoding for the embedded logo/window icon and the Minecraft GUI assets
# (font/buttons) read from the locally cached vanilla jar.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "5"
open = "5"
# Browser login (authorization-code flow + PKCE + loopback redirect).
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
urlencoding = "2"

# Secure refresh-token storage — one native backend per OS, so no D-Bus/OpenSSL
# system dependencies are needed on Linux CI.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

# Embeds the dolphin icon into the Windows .exe (works with the mingw
# cross-toolchain via windres).
[build-dependencies]
winres = "0.1"

# A small, fast release binary — the whole point of going native.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
