# DolphinClient — website (static Next.js export) + downloads.
# Behind Cloudflare (Full): edge TLS to the browser, LE cert to the origin.
# Port 80 stays reachable for ACME renewals.

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid example.invalid example.invalid;

    root /var/www/example.invalid;
    index index.html;

    include snippets/cloudflare-real-ip.conf;
    include snippets/dolphinclient-locations.conf;

    error_page 404 /404.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.invalid example.invalid example.invalid;

    root /var/www/example.invalid;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/cloudflare-real-ip.conf;
    include snippets/dolphinclient-locations.conf;

    error_page 404 /404.html;
}
