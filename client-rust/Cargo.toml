[package]
name = "dolphinclient"
version = "0.25.0"
edition = "2024"
description = "DolphinClient native Rust Minecraft client for 26.1 — azalea protocol + wgpu renderer."
license = "UNLICENSED"

# Fast dev iteration: optimize deps (azalea/wgpu are unusable at opt-level 0),
# keep our own code lightly optimized for compile speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.103"
azalea = "0.16.0"
# Chat component types (FormattedText/Style/ClickEvent) — same version as the
# one azalea uses so the types unify.
azalea-chat = "0.16.0"
# Menu/slot/click-operation types for the container GUIs (same version).
azalea-inventory = "0.16.0"
# Decoding the base64 `textures` profile property (skin URLs).
base64 = "0.22"
# Opening chat links in the system browser.
open = "5"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
flate2 = "1.1.9"
glam = "0.33.2"
# Server-address resolution (SRV → A/AAAA) with our own tuned resolver: IPv4-
# first, short timeouts, public-DNS fallback and an in-process result cache so
# reconnects are instant. Same version azalea pulls in transitively, so the
# resolver types unify and we don't bloat the tree. Default features
# (system-config + tokio) match azalea's.
hickory-resolver = "0.25.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
parking_lot = "0.12.5"
pollster = "0.4.0"
rayon = "1.12.0"
# Audio: OGG/Vorbis playback via the light lewton decoder (no symphonia). Sounds
# stream in on demand from Mojang's asset server and are cached on disk.
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
# Used to name azalea's account-trait signature types (Proxy), parse the session
# UUID, AND (async, via the tokio runtime) lazily fetch sound OGGs. The core
# async client + rustls TLS are non-optional in reqwest 0.13, so no extra
# features are needed; the real crates come transitively from azalea and these
# pin the same versions so the types unify.
reqwest = { version = "0.13.4", default-features = false }
uuid = "1.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "29.0.4"
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Embeds the dolphin icon into the Windows .exe (mingw windres on cross-builds).
[build-dependencies]
winres = "0.1"

# Vendored azalea crates carrying our gameplay-physics patches (vendor/…).
# Same version as crates.io, so all other azalea crates unify with them:
# - azalea-entity: adds Physics.stuck_speed_multiplier (cobweb & co).
# - azalea-physics: cobweb/powder-snow/berry-bush stuck speed, soul-sand/
#   honey block speed factor, slime-block bounce, real update_swimming.
# - azalea-client: real `is_underwater` (enables vanilla sprint-swimming)
#   and the Swimming pose in update_pose.
[patch.crates-io]
azalea-entity = { path = "vendor/azalea-entity" }
azalea-physics = { path = "vendor/azalea-physics" }
azalea-client = { path = "vendor/azalea-client" }
