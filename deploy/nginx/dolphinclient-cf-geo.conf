# Cloudflare origin check for the admin portal.
# 1 = the request came through Cloudflare's network, 0 = straight to the origin.
# Generated from deploy/nginx/cloudflare-real-ip.conf (same list, one source).
# $realip_remote_addr is the REAL peer (not the visitor IP that real_ip
# substitutes) — which is exactly what matters here.
geo $realip_remote_addr $dolphin_from_cf {
    default 0;
    127.0.0.1/32 1;   # local checks (curl on the server itself)
    ::1/128 1;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/18 1;
    192.0.2.1/18 1;
    192.0.2.1/20 1;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/17 1;
    192.0.2.1/15 1;
    192.0.2.1/13 1;
    192.0.2.1/14 1;
    192.0.2.1/13 1;
    192.0.2.1/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
