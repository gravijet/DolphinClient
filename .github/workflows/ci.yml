name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  js:
    name: JS (backend typecheck, website build)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit -p tsconfig.json
      - name: Typecheck legacy launcher (Electron)
        run: cd launcher && npx tsc --noEmit -p tsconfig.json
      - name: Build website
        run: cd website && npx next build

  launcher-native:
    name: Native launcher (Rust)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher-native/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('launcher-native/Cargo.lock', 'launcher-native/Cargo.toml') }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release

  client:
    name: Client (Fabric mod, Minecraft 26.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build client
        run: |
          cd client
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain
