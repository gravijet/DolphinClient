# Shared locations for dolphinclient.de (HTTP + HTTPS). No backend proxy —
# the website is a static export; the only local service is the Access gate that
# guards /admin (see dolphinclient-admin.conf).
#
# Diese Datei liegt im Repo unter deploy/nginx/ und wird von
# deploy/setup-zero-trust.sh nach /etc/nginx/snippets/ installiert.

# Eigenes Zugriffslog: auf diesem Host laufen mehrere Websites, und das
# Admin-Portal soll NUR die Zahlen dieser Seite auswerten.
access_log /var/log/nginx/dolphinclient.access.log combined;

# Let's Encrypt HTTP-01 (Cloudflare passes this path through unencrypted).
location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    allow all;
}

# Admin portal + its data, behind Cloudflare Access.
include snippets/dolphinclient-admin.conf;

# Browsers ask for this even when the page links a PNG/SVG icon — answer with
# the real icon instead of collecting 404s.
location = /favicon.ico {
    try_files /favicon.png =204;
    access_log off;
}

# Download manifest: never cache, so new versions appear immediately.
location = /downloads/manifest.json {
    default_type application/json;
    add_header Cache-Control "no-store";
}

# Release screenshots: pictures for the changelog, so they are shown INLINE
# (the rule below would otherwise send every /downloads/ file as an attachment).
location ^~ /downloads/shots/ {
    add_header Cache-Control "public, max-age=86400";
    access_log off;
    try_files $uri =404;
}

# Installer / client binaries — served as attachments. Logged to their own file
# so the admin portal can count real downloads.
location /downloads/ {
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Disposition "attachment";
    access_log /var/log/nginx/dolphinclient.downloads.log combined;
    try_files $uri =404;
}

# Immutable Next.js build assets.
location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Static Next.js export (trailingSlash: true -> <route>/index.html).
location / {
    try_files $uri $uri/ =404;
}
